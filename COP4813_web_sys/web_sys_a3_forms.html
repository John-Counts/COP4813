	<main>
		<h2>Forms</h2>
		<p>The purpose of this assignment is to practice the use of forms.</p>
		<form action="mailto:john_counts825@daytonastate.edu" method="post" enctype="text/plain">
			<fieldset>
				<legend>personal information</legend>
				<label for="fname">first name: </label>
				<input type="text" id="fname" name="fname" placeholder="first name" pattern="[A-Za-z]{1,15}" title="first name" required>
				<label for="lname">last name: </label>
				<input type="text" id="lname" name="lname" placeholder="last name" pattern="[A-Za-z]{1,15}" title="last name" required>
				<br><br>
				<label for="addr_street">street address: </label>
				<input type="text" id="addr_street" name="addr_street" placeholder="street address" pattern="[A-Za-z0-9]{1,255}" required>
				<label for="addr_unit">apartment/unit: </label>
				<input type="text" id="addr_unit" name="addr_unit" placeholder="apartment or unit number" pattern="[A-Za-z0-9]{1,15}">
				<br><br>
				<label for="addr_city">city: </label>
				<input type="text" id="addr_city" name="addr_city" placeholder="City" pattern="[A-Za-z]{1-255}" required>
				<label for="addr_state">state: </label>
				<select id="addr_state" name="addr_state">
					<option value="FL">FL</option>
					<option value="notFL">not FL</option>
				</select>
				<label for="addr_zip">zip code: </label>
				<input type="text" id="addr_zip" name="addr_zip" placeholder="zip code" pattern="[A-Za-z0-9]{1-15}">
				<br><br>
				<label for="phone">phone number: </label>
				<input type="tel" id="phone" name="phone" placeholder="(555) 555-1234" maxlength="14">
				<script>
				const phone_input = document.getElementById("phone");
				phone_input.addEventListener("input", function (event) {
					let phone = event.target.value.replace(/\D/g, "");
					phone = phone.substring(0, 10);
					if (phone.length > 6) {
						phone = "(" + phone.substring(0, 3) + ") " + phone.substring(3, 6) + "-" + phone.substring(6);
					} else if (phone.length > 3) {
						phone = "(" + phone.substring(0, 3) + ") " + phone.substring(3);
					} else if (phone.length > 0) {
						phone = "(" + phone;
					}
					event.target.value = phone;
				});
				</script>
				<br><br>
				<label for="addr_email">email: </label>
				<input type="email" id="addr_email" name="addr_email" placeholder="email@host.com" required>
			</fieldset>
			<fieldset>
				<legend>message</legend>
				<label for="message">enter a message: </label>
				<textarea name="message" id="message" rows="4" cols="64" placeholder="type a message here."></textarea>
			</fieldset>
			<br>
			<button type="submit" value="send">Submit</button>
		</form>
