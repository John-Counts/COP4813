<!DOCTYPE html>
<html lang="en">
<head>
	<title>{{ page.title }}</title>
	<meta http-equiv="content-type" content="text/html;charset=utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<link rel="stylesheet" href="{{ site.baseurl }}/assets/css/jc_structure_basic.css">
	<link rel="stylesheet" href="{{ site.baseurl }}/assets/css/jc_col_1.css">
	{% if page.extra_css %}
		<link rel="stylesheet" href="{{ site.baseurl }}/assets/css/{{ page.extra_css }}">
	{% endif %}
	{% if page.head_js %}
		<script src="{{ site.baseurl }}/assets/js/{{ page.head_js }}">
	{% endif %}
</head>
<body>
	{% include header.html %}
	<main>{{ content }}</main>
	{% include footer.html %}
	{% if page.extra_js %}
		<script src="{{ site.baseurl }}/assets/js/{{ page.extra_js }}">
	{% endif %}
</body>
</html>
